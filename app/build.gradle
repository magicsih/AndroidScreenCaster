plugins {
    id 'com.android.application'
}

android {
    namespace 'com.github.magicsih.androidscreencaster'
    compileSdk 37
    defaultConfig {
        applicationId 'com.github.magicsih.androidscreencaster'
        minSdk 21
        targetSdk 37
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.github.magicsih.androidscreencaster.UiSmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
